name: Check publication

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Use project npm version
        run: npm install --global npm@11.6.2

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build and validate
        run: npm run build && npm run validate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Check discussion integration
        run: npm run build && node scripts/check-integrations.mjs
        env:
          PUBLIC_GISCUS_REPO: example/research
          PUBLIC_GISCUS_REPO_ID: R_test
          PUBLIC_GISCUS_CATEGORY_ID: DIC_test

      - name: Validate GitHub Pages project subpath
        run: npm run build && npm run validate && node scripts/check-subpath.mjs
        env:
          SITE_BASE: /research-lab/

      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-test-results
          path: test-results
          retention-days: 7
